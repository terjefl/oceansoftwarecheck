<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111111">
  <title>{% block title %}{{ t('site_title') }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body>
<header>
  <div class="wrap header-inner">
    <a class="brand" href="/"><img src="/static/img/foa-logo.png" alt="" width="106" height="40"><span>{{ t('site_title') }}</span></a>
    <nav>
      <a href="/"{% if path == '/' or path == '/analyze' or path.startswith('/vehicle/') or path.startswith('/result/') %} class="active" aria-current="page"{% endif %}>{{ t('nav_home') }}</a>
      <a href="/stats"{% if path.startswith('/stats') %} class="active" aria-current="page"{% endif %}>{{ t('nav_stats') }}</a>
      <a href="/how-it-works"{% if path == '/how-it-works' %} class="active" aria-current="page"{% endif %}>{{ t('nav_how') }}</a>
      <a href="/privacy"{% if path == '/privacy' %} class="active" aria-current="page"{% endif %}>{{ t('nav_privacy') }}</a>
    </nav>
    <form class="langpicker" method="get" action="">
      <label class="visually-hidden" for="lang">{{ t('lang_label') }}</label>
      <select id="lang" name="lang" data-autosubmit>
        {% for code, name in languages.items() %}
        <option value="{{ code }}" {% if code == lang %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </form>
  </div>
</header>
<main class="wrap {% block main_class %}{% endblock %}">
  {% block content %}{% endblock %}
</main>
<footer>
  <div class="wrap footerwrap"><span>{{ t('footer_disclaimer') }}</span><a class="adminlink" href="/admin" aria-label="Admin" title="Admin">⚙</a></div>
</footer>
<script src="/static/app.js?v={{ static_v }}"></script>
</body>
</html>
