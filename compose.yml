# Local development. The production compose file lives in the operator's
# infrastructure repo.
services:
  oceansoftwarecheck:
    build: .
    image: oceansoftwarecheck:dev
    ports:
      - "8000:8000"
    volumes:
      - ./dev-data:/data
      # Local dev: copy requirements.example.yaml -> dev-config/requirements.yaml
      # and create dev-config/admin_users.yaml (see admin_users.example.yaml) for /admin
      - ./dev-config:/config
    environment:
      TZ: Europe/Oslo
      # Local dev runs over plain http, so the admin session cookie must not be Secure
      OSC_COOKIE_SECURE: "0"
