[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["data", "dev-data", "dev-config"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # long lines in comments, docstrings and SQL/HTML strings are tolerated

[tool.pytest.ini_options]
testpaths = ["tests"]
