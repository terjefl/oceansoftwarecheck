name: Build, publish and deploy image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libcairo2
          pip install --require-hashes -r requirements.lock
          pip install pytest httpx ruff
      - run: ruff check .
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oceansoftwarecheck:latest
            ghcr.io/${{ github.repository_owner }}/oceansoftwarecheck:${{ github.sha }}

  deploy:
    # Tell Portainer to re-pull :latest and redeploy the `oceansoftwarecheck` git stack.
    # The secret holds the stack's webhook URL (Portainer -> stack -> webhook).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "PORTAINER_WEBHOOK_URL not set, skipping"; exit 0; fi
          curl -fsS -X POST --max-time 120 "$WEBHOOK"
          echo "webhook accepted"
